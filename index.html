<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zebra EM45 App</title>
    
    <!-- Link to the Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        
        .card {
            text-align: center;
            padding: 25px;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 90%;
            margin: 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.tagline {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* Video Preview Screen styling */
        .video-container {
            width: 100%;
            height: 220px;
            background-color: #000;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Control Panel Buttons */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-primary {
            background-color: #2c3e50;
            color: white;
        }

        .btn-primary:hover { background-color: #1a252f; }

        .btn-accent {
            background-color: #f26522; /* Zebra Orange */
            color: white;
            grid-column: span 2;
        }

        .btn-accent:hover { background-color: #d84f10; }

        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }

        .btn-danger:hover { background-color: #c0392b; }

        .btn-disabled {
            background-color: #bdc3c7;
            color: #7f8c8d;
            cursor: not-allowed;
        }

        /* Status Indicator Overlay */
        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #2ecc71;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            display: none;
        }

        .status-recording {
            color: #e74c3c;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Zebra EM45 Utilities</h1>
        <p class="tagline">Camera & Hardware Controller</p>

        <!-- Camera Viewport container -->
        <div class="video-container">
            <div id="statusBadge" class="status-badge">● LIVE</div>
            <!-- Standard Video tag to stream camera feed -->
            <video id="preview" autoplay playsinline muted></video>
        </div>

        <!-- Utility Control Grid -->
        <div class="control-panel">
            <button id="cameraBtn" class="btn btn-primary" onclick="toggleCamera()">🎥 Start Camera</button>
            <button id="torchBtn" class="btn btn-disabled" onclick="toggleFlashlight()" disabled>🔦 Torch Off</button>
            <button id="recordBtn" class="btn btn-disabled" onclick="toggleRecord()" disabled>🔴 Record Video</button>
        </div>

        <!-- Official Product Page Link Button -->
        <a href="https://www.zebra.com/us/en/products/mobile-computers/handheld/em45-series.html" 
           target="_blank" 
           class="btn btn-accent" 
           style="text-decoration: none; width: 100%; box-sizing: border-box; text-align: center;">
           Explore Zebra EM45 Specs
        </a>
    </div>

    <script>
        let stream = null;
        let track = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let flashlightOn = false;

        const preview = document.getElementById('preview');
        const cameraBtn = document.getElementById('cameraBtn');
        const torchBtn = document.getElementById('torchBtn');
        const recordBtn = document.getElementById('recordBtn');
        const statusBadge = document.getElementById('statusBadge');

        // 1. Starts or Stops the Device Camera stream
        async function toggleCamera() {
            if (stream) {
                stopCamera();
                return;
            }

            try {
                // Request back-facing camera to support flashlight
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: 'environment' } },
                    audio: true
                });
            } catch (err) {
                // Fallback to any camera if strict environment/rear camera fails
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: true
                    });
                } catch (fallbackErr) {
                    alert('Could not access device camera: ' + fallbackErr.message);
                    return;
                }
            }

            preview.srcObject = stream;
            track = stream.getVideoTracks()[0];
            
            // Adjust Button states
            cameraBtn.innerText = "⏹ Stop Camera";
            cameraBtn.className = "btn btn-danger";
            recordBtn.className = "btn btn-primary";
            recordBtn.removeAttribute('disabled');
            statusBadge.style.display = "block";
            statusBadge.className = "status-badge";
            statusBadge.innerText = "● LIVE";

            // Check if the hardware support flashlight (torch)
            const capabilities = track.getCapabilities();
            if (capabilities.torch) {
                torchBtn.className = "btn btn-primary";
                torchBtn.removeAttribute('disabled');
            } else {
                torchBtn.innerText = "🔦 No Torch";
                torchBtn.className = "btn btn-disabled";
            }
        }

        function stopCamera() {
            if (flashlightOn) toggleFlashlight(); // Ensure torch is turned off
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                track = null;
            }
            preview.srcObject = null;

            // Reset Button states
            cameraBtn.innerText = "🎥 Start Camera";
            cameraBtn.className = "btn btn-primary";
            
            torchBtn.className = "btn btn-disabled";
            torchBtn.setAttribute('disabled', 'true');
            torchBtn.innerText = "🔦 Torch Off";
            flashlightOn = false;

            recordBtn.className = "btn btn-disabled";
            recordBtn.setAttribute('disabled', 'true');
            recordBtn.innerText = "🔴 Record Video";
            isRecording = false;

            statusBadge.style.display = "none";
        }

        // 2. Controls the LED Flashlight (Torch)
        async function toggleFlashlight() {
            if (!track) return;

            try {
                flashlightOn = !flashlightOn;
                await track.applyConstraints({
                    advanced: [{ torch: flashlightOn }]
                });
                
                if (flashlightOn) {
                    torchBtn.innerText = "🔦 Torch On";
                    torchBtn.style.backgroundColor = "#f1c40f"; // Gold/Yellow
                    torchBtn.style.color = "#000";
                } else {
                    torchBtn.innerText = "🔦 Torch Off";
                    torchBtn.style.backgroundColor = "#2c3e50";
                    torchBtn.style.color = "white";
                }
            } catch (err) {
                console.error("Flashlight control failed:", err);
                alert("Flashlight failed to trigger: " + err.message);
            }
        }

        // 3. Records video clips and saves them to your files
        function toggleRecord() {
            if (!stream) return;

            if (isRecording) {
                mediaRecorder.stop();
                recordBtn.innerText = "🔴 Record Video";
                recordBtn.className = "btn btn-primary";
                statusBadge.className = "status-badge";
                statusBadge.innerText = "● LIVE";
                isRecording = false;
            } else {
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
