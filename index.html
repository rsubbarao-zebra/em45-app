<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zebra EM45 App</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        
        .card {
            text-align: center;
            padding: 25px;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 90%;
            margin: 20px;
            box-sizing: border-box;
            position: relative;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.tagline {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* Styling for your uploaded Zebra EM45 RFID Image */
        .device-image {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 8px;
            margin: 10px auto 20px auto;
            display: block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .device-image:hover {
            transform: scale(1.03);
        }

        .specs-list {
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #34495e;
            line-height: 1.6;
        }

        .specs-list strong {
            color: #2c3e50;
        }

        /* Stylized Reviews Box */
        .reviews-box {
            text-align: left;
            background: #fff9f5; /* Light Zebra-Orange tint */
            border-left: 4px solid #f26522; /* Zebra Brand Orange */
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #2c3e50;
            line-height: 1.5;
        }

        .reviews-box strong {
            color: #f26522;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .reviews-box p {
            margin: 8px 0;
            font-style: italic;
            position: relative;
        }

        /* Video Stream Display */
        .video-container {
            width: 100%;
            height: 220px;
            background-color: #2c3e50;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder-text {
            color: #ecf0f1;
            font-size: 14px;
            padding: 20px;
            line-height: 1.4;
        }

        /* Buttons */
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .control-panel .btn {
            margin-bottom: 0;
        }

        .btn-primary { background-color: #2c3e50; color: white; }
        .btn-primary:hover { background-color: #1a252f; }
        
        .btn-accent { background-color: #f26522; color: white; }
        .btn-accent:hover { background-color: #d84f10; }
