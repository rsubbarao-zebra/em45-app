<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zebra EM45 App</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        
        .card {
            text-align: center;
            padding: 25px;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 90%;
            margin: 20px;
            box-sizing: border-box;
            position: relative;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.tagline {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* Device illustration */
        .device-illustration {
            width: 140px;
            height: auto;
            margin: 10px auto 20px auto;
            display: block;
        }

        .specs-list {
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #34495e;
            line-height: 1.6;
        }

        .specs-list strong {
            color: #2c3e50;
        }

        /* Video Stream Display */
        .video-container {
            width: 100%;
            height: 220px;
            background-color: #2c3e50;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder-text {
            color: #ecf0f1;
            font-size: 14px;
            padding: 20px;
            line-height: 1.4;
        }

        /* Buttons */
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .control-panel .btn {
            margin-bottom: 0; /* Reset margin for grid items */
        }

        .btn-primary { background-color: #2c3e50; color: white; }
        .btn-primary:hover { background-color: #1a252f; }
        
        .btn-accent { background-color: #f26522; color: white; }
        .btn-accent:hover { background-color: #d84f10; }
        
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-danger:hover { background-color: #c0392b; }
        
        .btn-disabled { background-color: #bdc3c7; color: #7f8c8d; cursor: not-allowed; }
        
        .btn-outline {
            background-color: transparent;
            border: 2px solid #2c3e50;
            color: #2c3e50;
        }
        .btn-outline:hover { background-color: #f8f9fa; }

        /* Top Navigation Bar for sub-pages */
        .nav-bar {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .nav-bar button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #2c3e50;
            padding: 0 10px 0 0;
        }

        .nav-bar h2 {
            margin: 0;
            font-size: 18px;
            color: #2c3e50;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #2ecc71;
            padding: 4px 10px;
